    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            /* BACKGROUND ANIMASI GRADIEN */
            background: linear-gradient(-45deg, black, grey, black, grey);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Animasi background bergerak */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Efek glassmorphism di container */
        .container {
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating animation buat profile pic */
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid black;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile h1 {
            color: black;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #fff; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px white; }
        }

        .profile h1 span {
            color: white;
            font-weight: 700;
        }

        .profile .title {
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .profile .title i {
            color: black;
            margin: 0 5px;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .profile .bio {
            color: white;
            font-size: 14px;
            margin-bottom: 25px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* MUSIC PLAYER */
        .music-player {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            padding: 10px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .music-info i {
            font-size: 20px;
            color: white;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .music-controls button {
            background: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            color: black;
        }

        .music-controls button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px red;
        }

        /* SOCIAL ICONS (KECIL) */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            text-decoration: none;
            font-size: 22px;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .social-icon:hover {
            background: white;
            color: black;
            transform: translateY(-5px) rotate(5deg);
            border-color: black;
            box-shadow: 0 10px 20px rgba(255,255,255,0.3);
        }

        /* TOMBOL UTAMA */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 15px;
            font-size: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .menu-item:hover::before {
            left: 100%;
        }

        .menu-item:hover {
            background: white;
            color: black;
            border-color: black;
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(255,255,255,0.2);
        }

        .menu-item i {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .menu-item:hover i {
            transform: scale(1.2);
        }

        .menu-item span {
            flex: 1;
            text-align: left;
            font-weight: 500;
        }

        /* COPYRIGHT */
        .copyright {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* PARTIKEL BACKGROUND (OPSIONAL) */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: floatParticle 10s infinite linear;
        }

        @keyframes floatParticle {
            from { transform: translateY(100vh) rotate(0deg); }
            to { transform: translateY(-100vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <script>
        // MUSIC PLAYER FUNCTION
        function toggleMusic() {
            var music = document.getElementById('bgMusic');
            var btn = document.getElementById('playPauseBtn');
            
            if (music.paused) {
                music.play();
                btn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                music.pause();
                btn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        // AUTO PLAY MUSIC (Diblock browser, perlu interaksi user dulu)
        // Makanya pake tombol

        // PARTIKEL BACKGROUND
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 10 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
                particle.style.animationDelay = (Math.random() * 5) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        window.onload = function() {
            createParticles();
        };
    </script>
    
<script>
    document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const text = this.getAttribute('data-copy');
            
            navigator.clipboard.writeText(text).then(() => {
                // SWEETALERT KEREN!
                Swal.fire({
                    title: 'Tercopy! 🎉',
                    text: `Username Roblox sudah di clipboard`,
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false,
                    position: 'top-end',
                    toast: true,
                    background: 'white',
                    color: 'grey',
                    iconColor: '#000000',
                    timerProgressBar: true,
                    showClass: {
                        popup: 'animate__animated animate__fadeInRight'
                    },
                    hideClass: {
                        popup: 'animate__animated animate__fadeOutRight'
                    }
                });
            }).catch(err => {
                Swal.fire({
                    title: 'Gagal! 😢',
                    text: 'Error: ' + err,
                    icon: 'error',
                    timer: 2000,
                    showConfirmButton: false
                });
            });
        });
    });
</script>
